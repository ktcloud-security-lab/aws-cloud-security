{% extends "base.html" %}
{% block title %}게시글 수정 · 게시판{% endblock %}
{% block content %}
<a class="back-link" href="{{ url_for('posts.post', pid=p.id) }}">← 게시글로</a>
<section class="page-heading"><div><p class="eyebrow">EDIT POST</p><h1>게시글 수정</h1><p class="description">제목과 내용을 수정해 주세요.</p></div></section>
<section class="editor-panel">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ auth_csrf_token() }}">
    <label for="title">제목 <span class="label-hint">최대 100자</span></label>
    <input id="title" name="title" required maxlength="100" value="{{ request.form.get('title', p.title) }}">
    <label for="body">내용</label>
    <textarea id="body" name="body" required rows="12">{{ request.form.get('body', p.body) }}</textarea>
    <div class="form-actions">
      <a class="button secondary" href="{{ url_for('posts.post', pid=p.id) }}">취소</a>
      <button class="button" type="submit">저장</button>
    </div>
  </form>
</section>
{% endblock %}
