{% extends "base.html" %}
{% block title %}비밀번호 재설정 · 게시판{% endblock %}
{% block content %}
<section class="auth-panel">
  <p class="eyebrow">NEW PASSWORD</p><h1>비밀번호 재설정</h1>
  <p class="description">영문·숫자·특수문자를 포함해 8자 이상으로 설정하세요. 변경 후 다시 로그인해야 합니다.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ auth_csrf_token() }}">
    <input type="hidden" name="token" value="{{ token }}">
    <label for="password">새 비밀번호</label>
    <input id="password" name="password" type="password" minlength="8" required autocomplete="new-password">
    <label for="password-confirm">새 비밀번호 확인</label>
    <input id="password-confirm" name="password_confirm" type="password" minlength="8" required autocomplete="new-password">
    <button class="button full" type="submit">비밀번호 변경</button>
  </form>
</section>
{% endblock %}
